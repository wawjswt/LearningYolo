<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">一阶段：许多位置同时输出候选</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">一阶段：许多位置同时输出候选</text><rect x="50" y="90" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="95" y="90" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="140" y="90" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="185" y="90" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="50" y="135" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="95" y="135" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="140" y="135" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="185" y="135" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="50" y="180" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="95" y="180" width="44" height="44" fill="#d8cdee" stroke="#c5b9d8"/><rect x="140" y="180" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="185" y="180" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="50" y="225" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="95" y="225" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="140" y="225" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><rect x="185" y="225" width="44" height="44" fill="#eeeaf4" stroke="#c5b9d8"/><text x="50" y="302" font-size="18" fill="#293d50">4×4位置，每处3组 → 48条</text><rect x="335" y="105" width="245" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="347" y="132" font-size="18" fill="#293d50">每条候选分别写出</text><text x="347" y="156" font-size="15" fill="#293d50">框参数与类别相关数值</text><path d="M240 170 L328 150" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M580 150 L650 150" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="660" y="105" width="255" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="672" y="132" font-size="18" fill="#293d50">筛分数，再去重复</text><text x="672" y="156" font-size="15" fill="#293d50">最后保留几个对象随图改变</text><rect x="335" y="260" width="580" height="65" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="347" y="287" font-size="18" fill="#293d50">再加2×2位置，每处3组 → 12条；两个尺度合计60条。</text><text x="28" y="400" font-size="16" fill="#293d50">这是教学网格；初代YOLO、SSD与YOLOv5的字段、尺度和匹配约定分别查看正文。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">漏检之后，从哪一段数据找原因</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">漏检之后，从哪一段数据找原因</text><rect x="30" y="85" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="112" font-size="18" fill="#293d50">先看原图与标签</text><text x="42" y="136" font-size="15" fill="#293d50">目标是否漏标、尺寸多小？</text><rect x="350" y="85" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="362" y="112" font-size="18" fill="#293d50">看预处理后的图与框</text><text x="362" y="136" font-size="15" fill="#293d50">缩放后目标还剩多少像素？</text><rect x="670" y="85" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="682" y="112" font-size="18" fill="#293d50">看筛选前候选</text><text x="682" y="136" font-size="15" fill="#293d50">是否已预测出合理框？</text><rect x="670" y="270" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="682" y="297" font-size="18" fill="#293d50">看阈值与NMS</text><text x="682" y="321" font-size="15" fill="#293d50">是否被筛掉或抑制？</text><rect x="350" y="270" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="362" y="297" font-size="18" fill="#293d50">按场景汇总失败</text><text x="362" y="321" font-size="15" fill="#293d50">小目标／夜间／遮挡分别看</text><rect x="30" y="270" width="260" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="297" font-size="18" fill="#293d50">做单项对照实验</text><text x="42" y="321" font-size="15" fill="#293d50">固定划分、指标、输入条件</text><path d="M290 125 L343 125" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M610 125 L663 125" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M800 165 L800 263" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M670 310 L617 310" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M350 310 L297 310" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">每个改动先对应一条观察证据，再比较精度、开销和部署表现。</text></g></svg>
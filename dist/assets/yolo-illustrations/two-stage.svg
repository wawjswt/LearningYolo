<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">R-CNN → Fast R-CNN → Faster R-CNN：共享哪些计算</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="450" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">R-CNN → Fast R-CNN → Faster R-CNN：共享哪些计算</text><rect x="25" y="90" width="180" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="117" font-size="18" fill="#293d50">R-CNN</text><text x="37" y="141" font-size="15" fill="#293d50">整图→外部候选</text><rect x="265" y="90" width="255" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="117" font-size="18" fill="#293d50">每个区域分别过CNN</text><text x="277" y="141" font-size="15" fill="#293d50">再分类与修框</text><rect x="25" y="200" width="180" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="227" font-size="18" fill="#293d50">Fast R-CNN</text><text x="37" y="251" font-size="15" fill="#293d50">整图卷积一次</text><rect x="265" y="200" width="255" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="227" font-size="18" fill="#293d50">外部候选→区域池化</text><text x="277" y="251" font-size="15" fill="#293d50">共享特征→分类与修框</text><rect x="25" y="310" width="180" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="337" font-size="18" fill="#293d50">Faster R-CNN</text><text x="37" y="361" font-size="15" fill="#293d50">整图卷积一次</text><rect x="265" y="310" width="255" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="337" font-size="18" fill="#293d50">RPN→候选区域</text><text x="277" y="361" font-size="15" fill="#293d50">区域头→分类与修框</text><rect x="640" y="160" width="280" height="120" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="652" y="187" font-size="18" fill="#293d50">关键区别</text><text x="652" y="211" font-size="15" fill="#293d50">卷积是否共享？</text><text x="652" y="235" font-size="15" fill="#293d50">候选由谁产生？</text><text x="652" y="259" font-size="15" fill="#293d50">是否再做区域级检测？</text><path d="M205 125 L258 125" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M205 235 L258 235" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M205 345 L258 345" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="428" font-size="16" fill="#293d50">“两阶段”按候选建议与区域检测的职责划分，不按图中方框数计数。</text></g></svg>
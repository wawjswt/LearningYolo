<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title"><title id="title">同一套模型代码，三条不同任务路线</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="460" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">同一套模型代码，三条不同任务路线</text><rect x="25" y="90" width="170" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="117" font-size="18" fill="#293d50">train.py</text><text x="37" y="141" font-size="15" fill="#293d50">图片＋标签</text><rect x="265" y="90" width="290" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="117" font-size="18" fill="#293d50">模型前向＋ComputeLoss</text><text x="277" y="141" font-size="15" fill="#293d50">分配→损失→梯度→更新</text><rect x="25" y="205" width="170" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="232" font-size="18" fill="#293d50">val.py</text><text x="37" y="256" font-size="15" fill="#293d50">权重＋图片＋标签</text><rect x="265" y="205" width="290" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="232" font-size="18" fill="#293d50">预测与标注匹配</text><text x="277" y="256" font-size="15" fill="#293d50">按协议统计P、R、AP</text><rect x="25" y="320" width="170" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="347" font-size="18" fill="#293d50">detect.py</text><text x="37" y="371" font-size="15" fill="#293d50">权重＋新图片</text><rect x="265" y="320" width="290" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="277" y="347" font-size="18" fill="#293d50">预测→NMS→映回原图</text><text x="277" y="371" font-size="15" fill="#293d50">绘图／保存结果</text><rect x="665" y="150" width="260" height="140" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="677" y="177" font-size="18" fill="#293d50">共享的结构入口</text><text x="677" y="201" font-size="15" fill="#293d50">models/*.yaml</text><text x="677" y="225" font-size="15" fill="#293d50">models/yolo.py：组装</text><text x="677" y="249" font-size="15" fill="#293d50">models/common.py：模块</text><path d="M195 125 L258 125" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M195 240 L258 240" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M195 355 L258 355" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M555 125 L658 180" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M555 240 L658 220" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M555 355 L658 260" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="438" font-size="16" fill="#293d50">数据配置、模型配置与超参数分别说明不同的约定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">YOLOv5l：空间变小，通道如何变化</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="450" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">YOLOv5l：空间变小，通道如何变化</text><rect x="35" y="100" width="135" height="145" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="47" y="127" font-size="18" fill="#293d50">640×640</text><text x="47" y="151" font-size="15" fill="#293d50">C = 3</text><text x="35" y="290" font-size="15" fill="#293d50">RGB输入</text><path d="M170 165 L184 165" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="189" y="100" width="135" height="112.78174593052023" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="201" y="127" font-size="18" fill="#293d50">320×320</text><text x="201" y="151" font-size="15" fill="#293d50">C = 64</text><text x="189" y="290" font-size="15" fill="#293d50">下采样之后</text><path d="M324 165 L338 165" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="343" y="100" width="135" height="90" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="355" y="127" font-size="18" fill="#293d50">160×160</text><text x="355" y="151" font-size="15" fill="#293d50">C = 128</text><text x="343" y="290" font-size="15" fill="#293d50">下采样之后</text><path d="M478 165 L492 165" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="497" y="100" width="135" height="73.89087296526012" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="509" y="127" font-size="18" fill="#293d50">80×80</text><text x="509" y="151" font-size="15" fill="#293d50">C = 256</text><text x="497" y="290" font-size="15" fill="#293d50">下采样之后</text><path d="M632 165 L646 165" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="651" y="100" width="135" height="62.5" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="663" y="127" font-size="18" fill="#293d50">40×40</text><text x="663" y="151" font-size="15" fill="#293d50">C = 512</text><text x="651" y="290" font-size="15" fill="#293d50">下采样之后</text><path d="M786 165 L800 165" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="805" y="100" width="135" height="54.44543648263006" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="817" y="127" font-size="18" fill="#293d50">20×20</text><text x="817" y="151" font-size="15" fill="#293d50">C = 1024</text><text x="805" y="290" font-size="15" fill="#293d50">下采样之后</text><rect x="90" y="335" width="780" height="60" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="102" y="362" font-size="18" fill="#293d50">空间位置数H×W与每位置特征数C，是两个不同维度。</text><text x="28" y="424" font-size="16" fill="#293d50">方形640输入的尺寸主线；同尺寸的C3/SPPF步骤在各自课程中拆解。</text></g></svg>
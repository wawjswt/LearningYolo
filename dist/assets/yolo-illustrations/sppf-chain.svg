<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">SPPF：同尺寸上串行池化，再汇总四路</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">SPPF：同尺寸上串行池化，再汇总四路</text><rect x="20" y="90" width="155" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="32" y="117" font-size="18" fill="#293d50">1×1卷积</text><text x="32" y="141" font-size="15" fill="#293d50">1024 → 512</text><rect x="235" y="90" width="170" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="247" y="117" font-size="18" fill="#293d50">MaxPool 5×5</text><text x="247" y="141" font-size="15" fill="#293d50">有效范围5×5</text><rect x="465" y="90" width="170" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="477" y="117" font-size="18" fill="#293d50">MaxPool 5×5</text><text x="477" y="141" font-size="15" fill="#293d50">有效范围9×9</text><rect x="695" y="90" width="170" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="707" y="117" font-size="18" fill="#293d50">MaxPool 5×5</text><text x="707" y="141" font-size="15" fill="#293d50">有效范围13×13</text><rect x="220" y="285" width="480" height="75" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="232" y="312" font-size="18" fill="#293d50">原特征＋三次池化 → Concat</text><text x="232" y="336" font-size="15" fill="#293d50">4×512=2048 → 1×1卷积 → 1024</text><path d="M175 130 L228 130" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M405 130 L458 130" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M635 130 L688 130" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M95 170 L260 278" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M320 170 L380 278" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M550 170 L500 278" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M780 170 L625 278" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">池化步长1、填充2，空间尺寸保持不变；5/9/13相对模块内特征计算。</text></g></svg>
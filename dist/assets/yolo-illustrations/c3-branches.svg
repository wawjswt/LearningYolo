<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">C3：两条投影分支，最后沿通道拼接</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">C3：两条投影分支，最后沿通道拼接</text><rect x="25" y="180" width="155" height="75" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="207" font-size="18" fill="#293d50">输入</text><text x="37" y="231" font-size="15" fill="#293d50">C = 256</text><rect x="235" y="80" width="190" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="247" y="107" font-size="18" fill="#293d50">1×1卷积</text><text x="247" y="131" font-size="15" fill="#293d50">256 → 128</text><rect x="475" y="80" width="200" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="487" y="107" font-size="18" fill="#293d50">Bottleneck × n</text><text x="487" y="131" font-size="15" fill="#293d50">C = 128</text><rect x="235" y="280" width="190" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="247" y="307" font-size="18" fill="#293d50">另一组1×1卷积</text><text x="247" y="331" font-size="15" fill="#293d50">256 → 128</text><rect x="740" y="180" width="190" height="75" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="752" y="207" font-size="18" fill="#293d50">Concat → 1×1</text><text x="752" y="231" font-size="15" fill="#293d50">128+128 → 256</text><path d="M180 200 L228 115" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M425 115 L468 115" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M180 225 L228 315" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M675 115 L733 200" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M425 315 L733 230" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">两路都读取完整输入；Bottleneck内部的shortcut另按开关与形状判断。</text></g></svg>
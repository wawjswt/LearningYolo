<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">NMS手算：同一辆车附近的两个高分候选</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">NMS手算：同一辆车附近的两个高分候选</text><rect x="60" y="110" width="300" height="150" fill="#d6e5f0" stroke="#426d97" stroke-width="3"/><rect x="90" y="110" width="300" height="150" fill="#e8dcf2" fill-opacity=".55" stroke="#7660a6" stroke-width="3"/><text x="60" y="94" font-size="20" fill="#293d50">A：0.90</text><text x="220" y="291" font-size="20" fill="#293d50">B：0.80</text><rect x="480" y="95" width="435" height="190" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="492" y="122" font-size="18" fill="#293d50">两个框宽100、高50，水平相差10</text><text x="492" y="146" font-size="15" fill="#293d50">交集：90×50 = 4500</text><text x="492" y="170" font-size="15" fill="#293d50">并集：5000+5000−4500 = 5500</text><text x="492" y="194" font-size="15" fill="#293d50">IoU = 4500/5500 ≈ 0.818</text><text x="492" y="218" font-size="15" fill="#293d50">同类NMS阈值0.7：保留A，抑制B</text><text x="28" y="397" font-size="16" fill="#293d50">NMS的重叠门槛，与分数筛选门槛和评价匹配IoU门槛分别设置。</text></g></svg>
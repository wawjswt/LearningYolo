<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title"><title id="title">从排序预测走到PR曲线与AP面积</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="590" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">从排序预测走到PR曲线与AP面积</text><text x="38" y="79" font-size="16" fill="#293d50">人工设定：3个真实目标；预测按置信度从高到低排列</text><rect x="38" y="102" width="58" height="42" fill="#e9e5ef" stroke="#c8bfd3"/><text x="44" y="129" font-size="14" fill="#293d50">序号</text><rect x="96" y="102" width="74" height="42" fill="#e9e5ef" stroke="#c8bfd3"/><text x="102" y="129" font-size="14" fill="#293d50">分数</text><rect x="170" y="102" width="72" height="42" fill="#e9e5ef" stroke="#c8bfd3"/><text x="176" y="129" font-size="14" fill="#293d50">匹配</text><rect x="242" y="102" width="82" height="42" fill="#e9e5ef" stroke="#c8bfd3"/><text x="248" y="129" font-size="14" fill="#293d50">累计P</text><rect x="324" y="102" width="82" height="42" fill="#e9e5ef" stroke="#c8bfd3"/><text x="330" y="129" font-size="14" fill="#293d50">累计R</text><rect x="38" y="144" width="58" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="45" y="171" font-size="14" fill="#293d50">A</text><rect x="96" y="144" width="74" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="103" y="171" font-size="14" fill="#293d50">.95</text><rect x="170" y="144" width="72" height="42" fill="#e2efe8" stroke="#d5d0d8"/><text x="177" y="171" font-size="14" fill="#293d50">TP</text><rect x="242" y="144" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="249" y="171" font-size="14" fill="#293d50">1.00</text><rect x="324" y="144" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="331" y="171" font-size="14" fill="#293d50">1/3</text><rect x="38" y="186" width="58" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="45" y="213" font-size="14" fill="#293d50">B</text><rect x="96" y="186" width="74" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="103" y="213" font-size="14" fill="#293d50">.82</text><rect x="170" y="186" width="72" height="42" fill="#e2efe8" stroke="#d5d0d8"/><text x="177" y="213" font-size="14" fill="#293d50">TP</text><rect x="242" y="186" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="249" y="213" font-size="14" fill="#293d50">1.00</text><rect x="324" y="186" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="331" y="213" font-size="14" fill="#293d50">2/3</text><rect x="38" y="228" width="58" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="45" y="255" font-size="14" fill="#293d50">C</text><rect x="96" y="228" width="74" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="103" y="255" font-size="14" fill="#293d50">.61</text><rect x="170" y="228" width="72" height="42" fill="#f6e9de" stroke="#d5d0d8"/><text x="177" y="255" font-size="14" fill="#293d50">FP</text><rect x="242" y="228" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="249" y="255" font-size="14" fill="#293d50">0.67</text><rect x="324" y="228" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="331" y="255" font-size="14" fill="#293d50">2/3</text><rect x="38" y="270" width="58" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="45" y="297" font-size="14" fill="#293d50">D</text><rect x="96" y="270" width="74" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="103" y="297" font-size="14" fill="#293d50">.34</text><rect x="170" y="270" width="72" height="42" fill="#e2efe8" stroke="#d5d0d8"/><text x="177" y="297" font-size="14" fill="#293d50">TP</text><rect x="242" y="270" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="249" y="297" font-size="14" fill="#293d50">.75</text><rect x="324" y="270" width="82" height="42" fill="#fbfaf7" stroke="#d5d0d8"/><text x="331" y="297" font-size="14" fill="#293d50">1.00</text><text x="38" y="334" font-size="13" fill="#293d50">TP：匹配到一个尚未匹配的真实目标；FP：误报。</text><rect x="570" y="133" width="330" height="250" rx="5" fill="#fff" stroke="#cfc9d2"/><path d="M612 161V341 M612 161H872" stroke="#e3dfe5" stroke-width="1"/><text x="605" y="361" font-size="11" fill="#687789">0</text><text x="582" y="165" font-size="11" fill="#687789">1</text><path d="M677 161V341 M612 206H872" stroke="#e3dfe5" stroke-width="1"/><text x="670" y="361" font-size="11" fill="#687789">0.25</text><text x="582" y="210" font-size="11" fill="#687789">0.75</text><path d="M742 161V341 M612 251H872" stroke="#e3dfe5" stroke-width="1"/><text x="735" y="361" font-size="11" fill="#687789">0.5</text><text x="582" y="255" font-size="11" fill="#687789">0.5</text><path d="M807 161V341 M612 296H872" stroke="#e3dfe5" stroke-width="1"/><text x="800" y="361" font-size="11" fill="#687789">0.75</text><text x="582" y="300" font-size="11" fill="#687789">0.25</text><path d="M872 161V341 M612 341H872" stroke="#e3dfe5" stroke-width="1"/><text x="865" y="361" font-size="11" fill="#687789">1</text><text x="582" y="345" font-size="11" fill="#687789">0</text><path d="M612 341V161 M612 341H872" stroke="#526273" stroke-width="2"/><path d="M612 341 V161 H785.3333333333333 V206 H872 V341 Z" fill="#dceee6" stroke="none"/><path d="M612 161 H785.3333333333333 V206 H872" fill="none" stroke="#34745c" stroke-width="4"/><path d="M698.6666666666666 161 L785.3333333333333 161 L785.3333333333333 221 L872 206" fill="none" stroke="#7660a6" stroke-width="3"/><circle cx="698.6666666666666" cy="161" r="5" fill="#7660a6" stroke="white" stroke-width="2"/><text x="704.6666666666666" y="155" font-size="11" fill="#493c65">A</text><circle cx="785.3333333333333" cy="161" r="5" fill="#7660a6" stroke="white" stroke-width="2"/><text x="791.3333333333333" y="155" font-size="11" fill="#493c65">B</text><circle cx="785.3333333333333" cy="221" r="5" fill="#7660a6" stroke="white" stroke-width="2"/><text x="791.3333333333333" y="215" font-size="11" fill="#493c65">C</text><circle cx="872" cy="206" r="5" fill="#7660a6" stroke="white" stroke-width="2"/><text x="878" y="200" font-size="11" fill="#493c65">D</text><text x="692" y="383" font-size="13" fill="#293d50">Recall（召回率）</text><text x="576" y="246" transform="rotate(-90 576 246)" font-size="13" fill="#293d50">Precision（精确率）</text><text x="38" y="497" font-size="16" fill="#293d50">插值精确率包住的面积：</text><text x="38" y="526" font-size="20" fill="#34745c">1/3×1 + 1/3×1 + 1/3×0.75 ≈ 0.917</text><text x="38" y="557" font-size="13" fill="#293d50">紫点/线：逐条预测的P-R；绿色阶梯：向右取最大精确率形成的包络。</text><text x="515" y="475" font-size="13" fill="#34745c">浅绿区域表示AP的直观面积</text><text x="515" y="501" font-size="13" fill="#293d50">真实版本按指定采样规则求面积。</text><text x="515" y="527" font-size="13" fill="#293d50">YOLOv5 v7.0采用101点插值；</text><text x="515" y="553" font-size="13" fill="#293d50">上式是连续区间手算近似示意。</text></g></svg>
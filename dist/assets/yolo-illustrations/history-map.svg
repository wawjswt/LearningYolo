<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">四个长期问题，推动不同检测路线</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">四个长期问题，推动不同检测路线</text><rect x="30" y="80" width="200" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="107" font-size="18" fill="#293d50">去哪找？</text><text x="42" y="131" font-size="15" fill="#293d50">滑动窗口／候选区域</text><rect x="270" y="80" width="200" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="282" y="107" font-size="18" fill="#293d50">怎样表示？</text><text x="282" y="131" font-size="15" fill="#293d50">HOG → CNN特征</text><rect x="510" y="80" width="200" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="522" y="107" font-size="18" fill="#293d50">怎样预测？</text><text x="522" y="131" font-size="15" fill="#293d50">区域头／密集位置</text><rect x="750" y="80" width="180" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="762" y="107" font-size="18" fill="#293d50">怎样去重？</text><text x="762" y="131" font-size="15" fill="#293d50">NMS／一对一监督</text><rect x="70" y="240" width="240" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="82" y="267" font-size="18" fill="#293d50">1998—2010</text><text x="82" y="291" font-size="15" fill="#293d50">窗口、特征与级联</text><rect x="360" y="240" width="240" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="372" y="267" font-size="18" fill="#293d50">2012—2019</text><text x="372" y="291" font-size="15" fill="#293d50">共享特征与多尺度</text><rect x="650" y="240" width="240" height="80" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="662" y="267" font-size="18" fill="#293d50">2020—2024代表节点</text><text x="662" y="291" font-size="15" fill="#293d50">集合预测、文字条件</text><path d="M230 120 L263 120" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M470 120 L503 120" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M710 120 L743 120" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M310 280 L353 280" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M600 280 L643 280" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">年代表示本课选取的代表性节点；各条研究路线持续并行。</text></g></svg>
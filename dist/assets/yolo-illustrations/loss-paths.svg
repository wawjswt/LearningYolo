<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">一个正样本，分别影响三项监督</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">一个正样本，分别影响三项监督</text><rect x="30" y="85" width="240" height="85" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="112" font-size="18" fill="#293d50">框定位</text><text x="42" y="136" font-size="15" fill="#293d50">CIoU = 0.6 → 框项0.4</text><rect x="350" y="85" width="250" height="85" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="362" y="112" font-size="18" fill="#293d50">物体性</text><text x="362" y="136" font-size="15" fill="#293d50">目标0.6，预测0.5</text><rect x="680" y="85" width="245" height="85" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="692" y="112" font-size="18" fill="#293d50">类别</text><text x="692" y="136" font-size="15" fill="#293d50">目标[0,1]，预测[0.8,0.2]</text><rect x="80" y="265" width="210" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="92" y="292" font-size="18" fill="#293d50">框项归约</text><text x="92" y="316" font-size="15" fill="#293d50">正样本位置</text><rect x="380" y="265" width="210" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="392" y="292" font-size="18" fill="#293d50">BCE ≈ 0.693</text><text x="392" y="316" font-size="15" fill="#293d50">还包括其他网格位置</text><rect x="680" y="265" width="245" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="692" y="292" font-size="18" fill="#293d50">类别平均BCE≈1.609</text><text x="692" y="316" font-size="15" fill="#293d50">正样本类别字段</text><path d="M150 170 L180 258" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M475 170 L485 258" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M800 170 L800 258" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">三项再按gain、尺度与实现归约组合；图中单项值不直接等于训练日志总损失。</text></g></svg>
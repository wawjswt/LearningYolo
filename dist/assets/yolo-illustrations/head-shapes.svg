<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">Detect：把21个通道拆成3条候选，每条7项</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">Detect：把21个通道拆成3条候选，每条7项</text><rect x="25" y="100" width="200" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="37" y="127" font-size="18" fill="#293d50">P3输出卷积</text><text x="37" y="151" font-size="15" fill="#293d50">[1,21,80,80]</text><rect x="275" y="100" width="200" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="287" y="127" font-size="18" fill="#293d50">view按字段分组</text><text x="287" y="151" font-size="15" fill="#293d50">[1,3,7,80,80]</text><rect x="525" y="100" width="220" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="537" y="127" font-size="18" fill="#293d50">permute交换轴</text><text x="537" y="151" font-size="15" fill="#293d50">[1,3,80,80,7]</text><rect x="225" y="290" width="520" height="75" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="237" y="317" font-size="18" fill="#293d50">7项 = 4框参数＋1物体性＋2类别字段</text><text x="237" y="341" font-size="15" fill="#293d50">P3共3×80×80 = 19,200条原始候选</text><path d="M225 145 L268 145" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M475 145 L518 145" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M635 195 L635 283" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="408" font-size="16" fill="#293d50">两类任务、每尺度3个Anchor、640方形输入；框参数尚需按推理规则解码。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">评价先匹配，再把TP、FP、FN数清楚</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="450" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">评价先匹配，再把TP、FP、FN数清楚</text><rect x="30" y="80" width="245" height="105" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="107" font-size="18" fill="#293d50">真实目标：3个</text><text x="42" y="131" font-size="15" fill="#293d50">按分数排序的4条预测</text><text x="42" y="155" font-size="15" fill="#293d50">匹配结果：TP、TP、FP、TP</text><rect x="355" y="80" width="245" height="105" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="367" y="107" font-size="18" fill="#293d50">只保留最高分1条</text><text x="367" y="131" font-size="15" fill="#293d50">P = 1/1 = 1</text><text x="367" y="155" font-size="15" fill="#293d50">R = 1/3</text><rect x="680" y="80" width="245" height="105" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="692" y="107" font-size="18" fill="#293d50">保留前2条</text><text x="692" y="131" font-size="15" fill="#293d50">P = 2/2 = 1</text><text x="692" y="155" font-size="15" fill="#293d50">R = 2/3</text><rect x="355" y="270" width="245" height="105" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="367" y="297" font-size="18" fill="#293d50">保留前3条</text><text x="367" y="321" font-size="15" fill="#293d50">P = 2/3</text><text x="367" y="345" font-size="15" fill="#293d50">R = 2/3</text><rect x="680" y="270" width="245" height="105" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="692" y="297" font-size="18" fill="#293d50">保留前4条</text><text x="692" y="321" font-size="15" fill="#293d50">P = 3/4 = 0.75</text><text x="692" y="345" font-size="15" fill="#293d50">R = 3/3 = 1</text><path d="M275 130 L348 130" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M600 130 L673 130" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M802 185 L802 263" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M680 320 L607 320" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="428" font-size="15" fill="#293d50">人工数据例子：需固定类别匹配、IoU阈值和一对一匹配；顺序与下文AP例子一致。</text></g></svg>
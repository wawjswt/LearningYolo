<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">一行模型YAML，怎样变成一次计算</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">一行模型YAML，怎样变成一次计算</text><text x="55" y="100" font-size="30" fill="#7660a6">[-1, 6, C3, [256]]</text><rect x="55" y="145" width="175" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="67" y="172" font-size="18" fill="#293d50">from = -1</text><text x="67" y="196" font-size="15" fill="#293d50">从上一层取输入</text><rect x="275" y="145" width="175" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="287" y="172" font-size="18" fill="#293d50">number = 6</text><text x="287" y="196" font-size="15" fill="#293d50">基础重复次数</text><rect x="495" y="145" width="175" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="507" y="172" font-size="18" fill="#293d50">module = C3</text><text x="507" y="196" font-size="15" fill="#293d50">调用C3模块</text><rect x="715" y="145" width="200" height="95" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="727" y="172" font-size="18" fill="#293d50">args = [256]</text><text x="727" y="196" font-size="15" fill="#293d50">约定基础输出通道</text><rect x="110" y="295" width="740" height="70" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="122" y="322" font-size="18" fill="#293d50">l配置深宽系数为1：一个C3，内部6个Bottleneck，输出256通道。</text><text x="28" y="404" font-size="16" fill="#293d50">其他规模经parse_model缩放；C3的内部重复与外部堆叠模块须分别确认。</text></g></svg>
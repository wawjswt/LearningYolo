<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">同一框从原图进入画布：位置与尺寸要同步变化</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="470" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">同一框从原图进入画布：位置与尺寸要同步变化</text><rect x="35" y="115" width="400" height="200" fill="#dfefe8" stroke="#477f6a"/><rect x="195" y="179" width="80" height="32" fill="none" stroke="#c67147" stroke-width="3"/><rect x="580" y="70" width="300" height="300" fill="#e4e0e9" stroke="#7660a6"/><rect x="580" y="145" width="300" height="150" fill="#dfefe8"/><rect x="700" y="193" width="60" height="24" fill="none" stroke="#c67147" stroke-width="3"/><text x="35" y="85" font-size="18" fill="#293d50">原图1000×500，框中心(500,200)</text><path d="M445 220 L567 220" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="590" y="55" font-size="18" fill="#293d50">画布640×640</text><text x="590" y="396" font-size="17" fill="#293d50">上下各补160；中心变为(320,288)</text><text x="28" y="443" font-size="15" fill="#293d50">缩放0.64：原框宽高(200,80) → (128,51.2)；网络画布坐标需要逆变换才能画回原图。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">初始化微调与断点续训，需要的状态不同</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="450" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">初始化微调与断点续训，需要的状态不同</text><rect x="30" y="165" width="190" height="90" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="42" y="192" font-size="18" fill="#293d50">已有.pt</text><text x="42" y="216" font-size="15" fill="#293d50">先检查实际内容</text><rect x="335" y="70" width="250" height="100" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="347" y="97" font-size="18" fill="#293d50">微调初始化</text><text x="347" y="121" font-size="15" fill="#293d50">筛选匹配的模型参数</text><text x="347" y="145" font-size="15" fill="#293d50">新任务可改变类别头</text><rect x="335" y="265" width="250" height="100" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="347" y="292" font-size="18" fill="#293d50">恢复原实验</text><text x="347" y="316" font-size="15" fill="#293d50">模型＋优化器＋轮次</text><text x="347" y="340" font-size="15" fill="#293d50">还原训练进度等状态</text><rect x="690" y="155" width="240" height="120" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="702" y="182" font-size="18" fill="#293d50">检查名称与形状</text><text x="702" y="206" font-size="15" fill="#293d50">类别数与类别顺序</text><text x="702" y="230" font-size="15" fill="#293d50">是否保留续训状态</text><text x="702" y="254" font-size="15" fill="#293d50">不能仅靠文件名判断</text><path d="M220 185 L328 120" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M220 225 L328 310" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M585 120 L683 185" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><path d="M585 310 L683 240" fill="none" stroke="#7660a6" stroke-width="2.5" marker-end="url(#arr)"/><text x="28" y="428" font-size="16" fill="#293d50">best.pt与last.pt可能被清理优化器状态；先检查保存内容再决定恢复方式。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title"><title id="title">读懂YOLOv5检测混淆矩阵：行预测，列真实</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="590" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">读懂YOLOv5检测混淆矩阵：行预测，列真实</text><text x="42" y="79" font-size="16" fill="#293d50">人工计数：行是预测类别，列是真实类别</text><text x="256" y="108" font-size="13" fill="#526273">列 →</text><rect x="220" y="98" width="115" height="32" fill="#eeebf2" stroke="#cec7d5"/><text x="228" y="119" font-size="13" fill="#293d50">真实 Smoke</text><rect x="335" y="98" width="115" height="32" fill="#eeebf2" stroke="#cec7d5"/><text x="343" y="119" font-size="13" fill="#293d50">真实 Fire</text><rect x="450" y="98" width="115" height="32" fill="#eeebf2" stroke="#cec7d5"/><text x="458" y="119" font-size="13" fill="#293d50">背景列*</text><rect x="102" y="130" width="118" height="75" fill="#eeebf2" stroke="#cec7d5"/><text x="110" y="172" font-size="14" fill="#293d50">预测 Smoke</text><rect x="102" y="205" width="118" height="75" fill="#eeebf2" stroke="#cec7d5"/><text x="110" y="247" font-size="14" fill="#293d50">预测 Fire</text><rect x="102" y="280" width="118" height="75" fill="#eee9f5" stroke="#cec7d5"/><text x="110" y="322" font-size="14" fill="#293d50">背景行*</text><rect x="220" y="130" width="115" height="75" fill="#dceee6" stroke="#cfc9d2" stroke-width="2"/><text x="268" y="178" font-size="24" fill="#34745c">3</text><rect x="335" y="130" width="115" height="75" fill="#f6ecd9" stroke="#cfc9d2" stroke-width="2"/><text x="383" y="178" font-size="24" fill="#293d50">0</text><rect x="450" y="130" width="115" height="75" fill="#e8e0f3" stroke="#cfc9d2" stroke-width="2"/><text x="498" y="178" font-size="24" fill="#66518d">1</text><rect x="220" y="205" width="115" height="75" fill="#f6ecd9" stroke="#cfc9d2" stroke-width="2"/><text x="268" y="253" font-size="24" fill="#293d50">1</text><rect x="335" y="205" width="115" height="75" fill="#dceee6" stroke="#cfc9d2" stroke-width="2"/><text x="383" y="253" font-size="24" fill="#34745c">2</text><rect x="450" y="205" width="115" height="75" fill="#e8e0f3" stroke="#cfc9d2" stroke-width="2"/><text x="498" y="253" font-size="24" fill="#66518d">0</text><rect x="220" y="280" width="115" height="75" fill="#f5deda" stroke="#cfc9d2" stroke-width="2"/><text x="268" y="328" font-size="24" fill="#a44f43">0</text><rect x="335" y="280" width="115" height="75" fill="#f5deda" stroke="#cfc9d2" stroke-width="2"/><text x="383" y="328" font-size="24" fill="#a44f43">1</text><rect x="450" y="280" width="115" height="75" fill="#fbfaf7" stroke="#cfc9d2" stroke-width="2"/><text x="498" y="328" font-size="24" fill="#293d50">0</text><text x="48" y="182" font-size="14" fill="#526273">行 ↓</text><rect x="620" y="116" width="292" height="88" rx="8" fill="#e6f0ea" stroke="#b9b0cb"/><text x="632" y="143" font-size="18" fill="#293d50">对角线：类别和位置都匹配</text><text x="632" y="167" font-size="15" fill="#293d50">Smoke 3个，Fire 2个</text><text x="632" y="191" font-size="15" fill="#293d50">这是匹配成功的计数。</text><rect x="620" y="222" width="292" height="88" rx="8" fill="#f7e7e3" stroke="#b9b0cb"/><text x="632" y="249" font-size="18" fill="#293d50">末行 Background：漏检</text><text x="632" y="273" font-size="15" fill="#293d50">有1个真实 Fire 没有匹配框</text><text x="632" y="297" font-size="15" fill="#293d50">背景行记录未匹配真实目标。</text><rect x="620" y="328" width="292" height="88" rx="8" fill="#eee8f5" stroke="#b9b0cb"/><text x="632" y="355" font-size="18" fill="#293d50">末列 Background：误报</text><text x="632" y="379" font-size="15" fill="#293d50">有1个预测 Smoke 没有匹配GT</text><text x="632" y="403" font-size="15" fill="#293d50">背景列记录未匹配预测框。</text><rect x="82" y="395" width="474" height="91" rx="8" fill="#f7f1e5" stroke="#b9b0cb"/><text x="94" y="422" font-size="18" fill="#293d50">错分：1个真实 Smoke 被报成 Fire。</text><text x="94" y="446" font-size="15" fill="#293d50">检测任务没有“所有背景像素都算TN”的格子；</text><text x="94" y="470" font-size="15" fill="#293d50">只统计参与匹配的框及未匹配项。</text><text x="82" y="519" font-size="15" fill="#293d50">由表可算：Smoke P=3/4、R=3/4；Fire P=2/3、R=2/3。</text><text x="82" y="550" font-size="13" fill="#293d50">*Background不是对象类别；本站为人工原始计数，v7.0绘图按真实类别列归一化。</text></g></svg>
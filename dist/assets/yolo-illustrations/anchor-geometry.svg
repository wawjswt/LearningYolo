<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">Anchor是参考宽高：几何适配与预测要分开</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7660a6"/></marker></defs><rect width="960" height="430" fill="#fbfaf7"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="28" y="36" font-size="23" fill="#293d50">Anchor是参考宽高：几何适配与预测要分开</text><rect x="95" y="100" width="264" height="184" fill="#ece8f6" stroke="#7660a6" stroke-width="3"/><rect x="99" y="128" width="256" height="128" fill="#dfefe8" fill-opacity=".8" stroke="#477f6a" stroke-width="3"/><text x="90" y="325" font-size="18" fill="#293d50">紫色参考：33×23；绿色真实框：32×16</text><rect x="455" y="100" width="445" height="155" rx="8" fill="#ece8f6" stroke="#b9b0cb"/><text x="467" y="127" font-size="18" fill="#293d50">宽方向最大比例：max(32/33,33/32)</text><text x="467" y="151" font-size="15" fill="#293d50">高方向最大比例：max(16/23,23/16)</text><text x="467" y="175" font-size="15" fill="#293d50">合并取最大：23/16 = 1.4375</text><text x="467" y="199" font-size="15" fill="#293d50">若anchor_t=4：1.4375 &lt; 4，通过匹配</text><text x="28" y="398" font-size="16" fill="#293d50">这里画的是宽高比较，不是在要求框重叠；参考尺寸与坐标单位必须一致。</text></g></svg>